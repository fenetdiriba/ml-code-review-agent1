<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ML Code Review Chat Assistant - Demo</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            margin: 0;
            padding: 20px;
            background: #1e1e1e;
            color: #d4d4d4;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .chat-container {
            max-width: 800px;
            margin: 0 auto;
            background: #252526;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            height: calc(100vh - 40px);
        }
        
        .chat-header {
            background: linear-gradient(135deg, #007acc 0%, #005a9e 100%);
            color: white;
            padding: 20px;
            border-radius: 8px 8px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .chat-header h1 {
            margin: 0;
            font-size: 20px;
        }
        
        .clear-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .clear-btn:hover {
            background: rgba(255,255,255,0.3);
        }
        
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .message {
            display: flex;
            gap: 12px;
            animation: fadeIn 0.3s ease-in;
        }
        
        .message.user {
            flex-direction: row-reverse;
        }
        
        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            flex-shrink: 0;
        }
        
        .message.user .message-avatar {
            background: #007acc;
            color: white;
        }
        
        .message.assistant .message-avatar {
            background: #28a745;
            color: white;
        }
        
        .message-content {
            background: #3c3c3c;
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 70%;
            line-height: 1.5;
        }
        
        .message.user .message-content {
            background: #007acc;
            color: white;
        }
        
        .message.assistant .message-content {
            background: #2d2d30;
            color: #d4d4d4;
        }
        
        .message-content pre {
            background: #1e1e1e;
            padding: 8px;
            border-radius: 4px;
            overflow-x: auto;
            margin: 8px 0;
        }
        
        .message-content code {
            background: #1e1e1e;
            padding: 2px 4px;
            border-radius: 3px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
        }
        
        .chat-input-container {
            padding: 20px;
            border-top: 1px solid #3c3c3c;
            background: #252526;
            border-radius: 0 0 8px 8px;
        }
        
        .chat-input-form {
            display: flex;
            gap: 12px;
        }
        
        .chat-input {
            flex: 1;
            background: #3c3c3c;
            border: 1px solid #5a5a5a;
            border-radius: 6px;
            padding: 12px 16px;
            color: #d4d4d4;
            font-size: 14px;
            resize: none;
            min-height: 20px;
            max-height: 100px;
        }
        
        .chat-input:focus {
            outline: none;
            border-color: #007acc;
        }
        
        .send-btn {
            background: #007acc;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 12px 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }
        
        .send-btn:hover {
            background: #005a9e;
        }
        
        .send-btn:disabled {
            background: #5a5a5a;
            cursor: not-allowed;
        }
        
        .typing-indicator {
            display: none;
            padding: 12px 16px;
            color: #888;
            font-style: italic;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .status {
            text-align: center;
            padding: 10px;
            background: #2d2d30;
            border-radius: 4px;
            margin-bottom: 10px;
            font-size: 12px;
        }
        
        .status.connected {
            background: #1e3a1e;
            color: #4caf50;
        }
        
        .status.disconnected {
            background: #3a1e1e;
            color: #f44336;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>🤖 ML Code Review Assistant</h1>
            <button class="clear-btn" onclick="clearChat()">Clear Chat</button>
        </div>
        
        <div class="status" id="status">Connecting to backend...</div>
        
        <div class="chat-messages" id="messages">
            <div class="message assistant">
                <div class="message-avatar">AI</div>
                <div class="message-content">
                    Hello! I'm your ML Code Review Assistant. I can help you analyze your machine learning code, suggest improvements, and answer questions about best practices. What would you like to know?
                </div>
            </div>
        </div>
        
        <div class="typing-indicator" id="typing">AI is typing...</div>
        
        <div class="chat-input-container">
            <form class="chat-input-form" id="chatForm">
                <textarea 
                    class="chat-input" 
                    id="messageInput" 
                    placeholder="Ask about ML code, best practices, or request analysis..."
                    rows="1"
                ></textarea>
                <button type="submit" class="send-btn" id="sendBtn">Send</button>
            </form>
        </div>
    </div>

    <script>
        const messagesContainer = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatForm = document.getElementById('chatForm');
        const status = document.getElementById('status');
        const typingIndicator = document.getElementById('typing');
        
        let isConnected = false;
        
        // Check backend connection
        async function checkConnection() {
            try {
                const response = await fetch('http://localhost:3000/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: 'ping' })
                });
                
                if (response.ok) {
                    status.textContent = '✅ Connected to backend';
                    status.className = 'status connected';
                    isConnected = true;
                } else {
                    throw new Error('Backend not responding');
                }
            } catch (error) {
                status.textContent = '❌ Backend not available - Running in demo mode';
                status.className = 'status disconnected';
                isConnected = false;
            }
        }
        
        // Auto-resize textarea
        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 100) + 'px';
        });
        
        // Handle form submission
        chatForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const message = messageInput.value.trim();
            if (!message) return;
            
            // Add user message
            addMessage(message, 'user');
            messageInput.value = '';
            messageInput.style.height = 'auto';
            
            // Show typing indicator
            typingIndicator.style.display = 'block';
            
            try {
                let response;
                
                if (isConnected) {
                    // Real backend
                    const result = await fetch('http://localhost:3000/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message })
                    });
                    
                    if (!result.ok) throw new Error('Backend error');
                    const data = await result.json();
                    response = data.response;
                } else {
                    // Demo responses
                    response = getDemoResponse(message);
                }
                
                // Hide typing indicator
                typingIndicator.style.display = 'none';
                
                // Add assistant response
                addMessage(response, 'assistant');
                
            } catch (error) {
                typingIndicator.style.display = 'none';
                addMessage('Sorry, I encountered an error. Please try again.', 'assistant');
            }
        });
        
        function addMessage(content, role) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = role === 'user' ? 'U' : 'AI';
            
            const messageContent = document.createElement('div');
            messageContent.className = 'message-content';
            messageContent.innerHTML = formatMessage(content);
            
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(messageContent);
            
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
        
        function formatMessage(content) {
            // Convert markdown-like formatting
            return content
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/`(.*?)`/g, '<code>$1</code>')
                .replace(/\n/g, '<br>');
        }
        
        function clearChat() {
            messagesContainer.innerHTML = `
                <div class="message assistant">
                    <div class="message-avatar">AI</div>
                    <div class="message-content">
                        Chat cleared. How can I help you with your ML code today?
                    </div>
                </div>
            `;
        }
        
        function getDemoResponse(message) {
            const lowerMessage = message.toLowerCase();
            
            if (lowerMessage.includes('hello') || lowerMessage.includes('hi')) {
                return "Hello! I'm your ML Code Review Assistant. I can help you analyze your machine learning code, suggest improvements, and answer questions about best practices. What would you like to know?";
            }
            
            if (lowerMessage.includes('overfitting')) {
                return "Overfitting occurs when your model learns the training data too well, including noise and irrelevant patterns. To prevent overfitting, consider:\n\n• Using cross-validation\n• Adding regularization (L1/L2)\n• Collecting more training data\n• Using simpler models\n• Early stopping during training";
            }
            
            if (lowerMessage.includes('cross validation')) {
                return "Cross-validation is a technique to assess how well your model will generalize to new data. Common approaches include:\n\n• K-fold cross-validation (typically k=5 or k=10)\n• Stratified k-fold (for classification)\n• Leave-one-out cross-validation\n• Time series cross-validation (for temporal data)";
            }
            
            if (lowerMessage.includes('feature engineering')) {
                return "Feature engineering is crucial for ML success:\n\n• **Feature Selection**: Choose relevant features using correlation analysis, mutual information, or recursive feature elimination\n• **Feature Creation**: Create new features from existing ones (polynomial features, interactions)\n• **Feature Scaling**: Normalize/standardize features for algorithms sensitive to scale\n• **Handling Missing Values**: Impute or remove missing data appropriately";
            }
            
            return "I'm here to help with your machine learning code! I can assist with:\n\n• Code review and best practices\n• Model evaluation and metrics\n• Feature engineering and selection\n• Hyperparameter tuning\n• Data preprocessing\n• Overfitting prevention\n• And much more!\n\nFeel free to ask specific questions about your ML workflow.";
        }
        
        // Initialize
        checkConnection();
        
        // Focus on input
        messageInput.focus();
    </script>
</body>
</html>
